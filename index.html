<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <style>
        .hero {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        .hero video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 100%);
        }
    </style>
</head>
<body>
    <div class="hero">
        <video autoplay muted loop>
            <source src="path/to/video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="fade"></div>
    </div>
</body>
</html>
